spring:
  application:
    name: bluestar-tournament
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/bluestar_tournament?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt-secret: ${JWT_SECRET:local-dev-jwt-secret-change-in-production}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:./uploads}
  slot-reservation-minutes: ${SLOT_RESERVATION_MINUTES:30}
  registration-test-min-squad: ${REGISTRATION_TEST_MIN_SQUAD:false}
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    quick-password: ${ADMIN_QUICK_PASSWORD:}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

logging:
  level:
    com.bluestar.tournament: INFO
